name: Play bundle

# The .aab for the Google Play closed test track. Push to the play-bundle branch, or run it by hand
# from the Actions tab. It comes out unsigned: the upload key never leaves Phil's computer, and Phil
# signs the bundle there with jarsigner before uploading it. Steps are in docs/play-upload-key.md.
# Google Play App Signing holds the app signing key; the upload key only proves an upload is ours.

on:
  push:
    branches: [play-bundle]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - name: Number this build
        # Play needs every upload to carry a higher version code than the last.
        run: node -e "const f='app.json',a=require('./'+f);a.expo.android.versionCode=Number(process.env.GITHUB_RUN_NUMBER);require('fs').writeFileSync(f,JSON.stringify(a,null,2))"
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Leave the bundle unsigned
        # The generated project signs release builds with the debug key. Play wants the upload key's
        # signature only, so the bundle is left bare for Phil to sign.
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              buildTypes {
                  release {
                      signingConfig null
                  }
              }
          }
          GRADLE
      - name: Build the bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
      - name: Name the bundle
        run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab "out/seller-card-app-${GITHUB_RUN_NUMBER}-unsigned.aab"
          if unzip -l out/*.aab | grep -qE 'META-INF/.*\.(RSA|EC|DSA)$'; then echo "::error::The bundle came out signed."; exit 1; fi
          ls -la out
      - name: Put the bundle on the play-bundle release
        # Release files download without a login. It's the same app as the public test APK.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view play-bundle >/dev/null 2>&1 || gh release create play-bundle --prerelease --title "Play bundle (unsigned)" --notes "Unsigned .aab for the closed test track. Phil signs it with the upload key before uploading."
          gh release upload play-bundle out/*.aab --clobber
