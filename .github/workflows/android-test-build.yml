name: Android test build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which version to build. Phil installs beside the closed test one.'
        type: choice
        default: closedTest
        options: [closedTest, phil]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  apk:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: 1
      EXPO_PUBLIC_APP_VARIANT: ${{ inputs.variant == 'phil' && 'phil' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build the APK
        working-directory: android
        # Release build, signed with the debug key: fine for sideloading test builds.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/seller-card-app-${{ inputs.variant == 'phil' && 'phil' || 'test' }}-${GITHUB_SHA::7}.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: seller-card-app-test-apk
          path: out/*.apk
      - name: Publish the Phil build to its own release
        if: inputs.variant == 'phil'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete phil-test-build --yes --cleanup-tag || true
          gh release create phil-test-build out/*.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Phil build (${GITHUB_SHA::7})" \
            --notes "Phil variant test build. On your Android phone, open this page, tap the .apk file to download it, then open it to install. Your phone may ask you to allow installs from your browser first."
      - name: Publish to the test build release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build out/*.apk \
            --prerelease \
            --title "Test build (${GITHUB_SHA::7})" \
            --notes "Latest test build from main. On your Android phone, open this page, tap the .apk file to download it, then open it to install. Your phone may ask you to allow installs from your browser first."
